<script type="module">
import * as THREE from '/templates/threejs_film/vendor/three.module.js';
import { build } from '../04_world/emu_connected_world.js';
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(1); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; document.querySelector('#stage').append(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color('#8fb9df'); scene.fog=new THREE.Fog('#8fb9df',260,620);

[[ -55,34,-35,18],[18,40,-70,24],[92,31,-25,20],[-95,48,42,28]].forEach(([x,y,z,s],i)=>{
