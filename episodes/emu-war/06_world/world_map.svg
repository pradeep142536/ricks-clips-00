ff">Continuity requirements</text><text x="25" y="78" font-family="Arial" font-size="17" fill="#d5dfeb">• Connected roads, tracks and fences     • Same sun direction in every location</text><text x="25" y="110" font-family="Arial" font-size="17" fill="#d5dfeb">• Soldier 1.7 m · emu 1.9 m · truck 5 m     • No holes, floating props or teleports</text><text x="25" y="142" font-family="Arial" font-size="17" fill="#d5dfeb">• Every camera stays inside this map     • Every view has foreground, subject and background</text><text x="25" y="190" font-family="Arial" font-size="18" font-weight="700" fill="#f4d67d">Next proof: scale test + full world flythrough before character animation.</text></g></svg>