name: Render Full Episode

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Install Playwright & Chromium
        run: |
          cd templates/threejs_film
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Bake Film Plan
        run: |
          python tools/film_plan.py check episodes/lake-peigneur/film.json

      - name: Render Full 83.5s Video (2513 frames at 1080x1920)
        run: |
          xvfb-run -s "-screen 0 1080x1920x24" node templates/threejs_film/render.mjs episodes/lake-peigneur/film.json --animatic --out final_full_episode_1080p.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final_full_episode_1080p
          path: final_full_episode_1080p.mp4
          retention-days: 14
