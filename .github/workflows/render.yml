name: Render Full Episode

on:
  workflow_dispatch:
    inputs:
      episode:
        description: 'Choose episode to render'
        required: true
        default: 'boston-molasses'
        type: choice
        options:
          - 'boston-molasses'
          - 'lake-peigneur'
  push:
    branches: [ main, master ]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Install Playwright & Chromium
        run: |
          cd templates/threejs_film
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Resolve Episode Target
        id: target
        run: |
          EP="${{ github.event.inputs.episode }}"
          if [ -z "$EP" ]; then
            EP="boston-molasses"
          fi
          echo "EPISODE=$EP" >> $GITHUB_ENV
          echo "Selected episode: $EP"

      - name: Bake Film Plan
        run: |
          python tools/film_plan.py check episodes/$EPISODE/film.json

      - name: Render Full Video (1080x1920)
        run: |
          xvfb-run -s "-screen 0 1080x1920x24" node templates/threejs_film/render.mjs episodes/$EPISODE/film.json --animatic --out ${EPISODE}_full_episode_1080p.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EPISODE }}_full_episode_1080p
          path: ${{ env.EPISODE }}_full_episode_1080p.mp4
          retention-days: 14
